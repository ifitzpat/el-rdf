name: CL-RDF Tests

on:
  push:
    branches: ['**']
    paths:
      - 'cl-rdf.lisp'
      - 'http-server.lisp'
      - 'package.lisp'
      - 'cl-rdf.asd'
      - 'tests/**'
      - '.github/workflows/cl-rdf-tests.yml'
  pull_request:
    paths:
      - 'cl-rdf.lisp'
      - 'http-server.lisp'
      - 'package.lisp'
      - 'cl-rdf.asd'
      - 'tests/**'
      - '.github/workflows/cl-rdf-tests.yml'

jobs:
  test:
    name: Test on ${{ matrix.lisp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lisp:
          - sbcl
          - ecl  # Now enabled with ECL-specific threading support

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ${{ matrix.lisp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.lisp }}

      - name: Install Quicklisp
        run: |
          curl -O https://beta.quicklisp.org/quicklisp.lisp
          if [ "${{ matrix.lisp }}" = "sbcl" ]; then
            sbcl --non-interactive --load quicklisp.lisp \
              --eval "(quicklisp-quickstart:install :path \"$HOME/quicklisp/\")"
          else
            ecl -norc -load quicklisp.lisp \
              -eval "(quicklisp-quickstart:install :path \"$HOME/quicklisp/\")" \
              -eval '(ext:quit)'
          fi

      - name: Load system and run tests
        run: |
          if [ "${{ matrix.lisp }}" = "sbcl" ]; then
            sbcl --non-interactive \
              --load "$HOME/quicklisp/setup.lisp" \
              --eval '(push (truename ".") asdf:*central-registry*)' \
              --eval '(format t "~%~%========================================~%")' \
              --eval '(format t "Loading cl-rdf test system...~%")' \
              --eval '(format t "========================================~%~%")' \
              --eval '(ql:quickload :cl-rdf/tests)' \
              --eval '(format t "~%~%========================================~%")' \
              --eval '(format t "Running cl-rdf test suite with FiveAM...~%")' \
              --eval '(format t "========================================~%~%")' \
              --eval '(let ((result (fiveam:run! :cl-rdf)))
                        (fresh-line)
                        (if (fiveam:results-status result)
                            (progn
                              (format t "~%~%✓ All tests passed!~%~%")
                              (uiop:quit 0))
                            (progn
                              (format t "~%~%✗ Some tests failed!~%~%")
                              (uiop:quit 1))))'
          else
            ecl -norc -load "$HOME/quicklisp/setup.lisp" \
              -eval '(push (truename ".") asdf:*central-registry*)' \
              -eval '(format t "~%~%========================================~%")' \
              -eval '(format t "Loading cl-rdf test system...~%")' \
              -eval '(format t "========================================~%~%")' \
              -eval '(ql:quickload :cl-rdf/tests)' \
              -eval '(format t "~%~%========================================~%")' \
              -eval '(format t "Running cl-rdf test suite with FiveAM...~%")' \
              -eval '(format t "========================================~%~%")' \
              -eval '(let ((result (fiveam:run! :cl-rdf)))
                        (fresh-line)
                        (if (fiveam:results-status result)
                            (progn
                              (format t "~%~%✓ All tests passed!~%~%")
                              (ext:quit 0))
                            (progn
                              (format t "~%~%✗ Some tests failed!~%~%")
                              (ext:quit 1))))'
          fi

  # Job that checks all implementations passed
  all-tests-passed:
    name: All implementations tested
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed on one or more Common Lisp implementations"
            exit 1
          fi
          echo "✓ All tests passed on all implementations"
